<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Every Human | Coming Soon</title>
  <meta name="description" content="Every Human — a program of Cerebral Palsy Alliance Research Foundation. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #288537;      /* CPARF green (logo, buttons) */
      --lime: #84bd00;       /* CPARF footer labels */
      --orange: #f6863e;     /* CPARF donate orange */
      --text: #54585a;       /* CPARF body gray */
      --footer-bg: #131914;  /* CPARF footer */
      --heading: "Raleway", "Helvetica Neue", Arial, sans-serif;
      --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; min-height: 100vh;
      font-family: var(--body); color: var(--text); background: #fff; line-height: 1.5;
    }
    header { padding: 28px 16px 0; display: flex; justify-content: center; }
    header img { width: 180px; height: auto; display: block; }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 64px 16px 80px;
    }
    .badge {
      display: inline-block; background: var(--orange); color: #fff;
      font-family: var(--heading); font-weight: 800; font-size: 0.85rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 8px 20px; border-radius: 100px; margin-bottom: 28px;
    }
    h1 {
      font-family: var(--heading); font-weight: 800; color: var(--green);
      font-size: clamp(3rem, 11vw, 6.5rem); line-height: 1; letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .rule { width: 72px; height: 4px; background: var(--lime); border-radius: 2px; margin: 0 auto 24px; }
    .tagline {
      font-family: var(--heading); font-weight: 600;
      font-size: clamp(1.1rem, 2.6vw, 1.5rem); max-width: 34ch;
    }
    footer { background: var(--footer-bg); color: #fff; padding: 40px 16px; text-align: center; font-size: 1rem; }
    footer address { font-style: normal; margin-bottom: 14px; line-height: 1.6; }
    footer p { margin-top: 6px; }
    footer .label { color: var(--lime); }
  </style>
</head>
<body>
  <header>
    <img src="cparf-logo.png" alt="CPARF — Cerebral Palsy Alliance Research Foundation" width="800" height="203">
  </header>

  <main>
    <span class="badge">Coming Soon</span>
    <h1>Every Human</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">A Program of Cerebral Palsy Alliance Research Foundation</p>
  </main>

  <footer>
    <address>
      CPARF<br>
      500 7th Avenue<br>
      8th Floor<br>
      New York, NY 10018
    </address>
    <p><span class="label">EIN:</span> 47-4851754</p>
    <p>CFC #86542</p>
  </footer>
</body>
</html>
